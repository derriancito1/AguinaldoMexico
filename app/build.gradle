plugins {
    alias(libs.plugins.android.application)
    id("com.google.gms.google-services") version "4.4.3"
    id("com.google.firebase.crashlytics") version "3.0.5"
}

android {
    namespace 'com.mexico.aguinaldo.aguinaldomexico'
    compileSdk 36

    defaultConfig {
        applicationId "com.mexico.aguinaldo.aguinaldomexico"
        minSdk 23
        targetSdk 36
        versionCode 13
        versionName "3.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'com.jakewharton.threetenabp:threetenabp:1.4.9'
    implementation 'com.google.firebase:firebase-database:22.0.0'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'com.google.firebase:firebase-crashlytics:20.0.0'
    implementation 'com.google.android.gms:play-services-ads:24.4.0'




}